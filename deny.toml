# cargo-deny policy. Run locally before committing: `cargo deny check`.
# Advisories are not ignored here on purpose: a finding means a real upgrade is pending.

[advisories]
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Only licenses that appear in the current dependency tree are allowed. A new
# license needs a deliberate decision and an entry here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path, which has no version to pin.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
