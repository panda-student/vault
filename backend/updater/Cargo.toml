[package]
name = "vault-updater"
version = "0.6.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
vault-contracts = { path = "../contracts" }
vault-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
semver = "1"
fs2 = "0.4"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", features = ["rust_backend"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }

[dev-dependencies]
tempfile = "3"
