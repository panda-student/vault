[package]
name = "vault-core"
version.workspace = true
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
vault-contracts = { path = "../contracts" }
vault-common = { path = "../common" }
vault-credentials = { path = "../credentials" }
vault-permissions = { path = "../permissions" }
vault-filling = { path = "../filling" }
vault-storage = { path = "../storage" }
vault-updater = { path = "../updater" }
vault-platform = { path = "../platform" }
vault-transfer = { path = "../transfer" }
vault-sync = { path = "../sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
rusqlite = "=0.41.1"
