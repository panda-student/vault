[package]
name = "vault-transfer"
version = "0.6.2"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
vault-contracts = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
argon2 = "0.5"
getrandom = "0.4"
zeroize = "1"
