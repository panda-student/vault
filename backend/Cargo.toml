[package]
name = "vault-backend"
version = "0.6.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "time", "process", "sync", "net"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
getrandom = "0.4"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_RestartManager", "Win32_System_Wmi", "Win32_UI_Shell"] }
base64 = "0.22"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
ed25519-dalek = "2"
sha2 = "0.10"
semver = "1"
fs2 = "0.4"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

flate2 = { version = "1", features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
