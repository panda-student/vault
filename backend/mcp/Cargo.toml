[package]
name = "vault-mcp"
version = "0.6.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[dependencies]
vault-contracts = { path = "../contracts" }
vault-core = { path = "../core" }
vault-platform = { path = "../platform" }
serde_json = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "time", "process", "sync", "net"] }
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
