[workspace]
members = ["backend/core", "backend/contracts", "backend/credentials", "backend/permissions", "backend/filling", "backend/storage", "backend/transfer", "backend/sync","backend/updater", "backend/platform", "backend/mcp", "backend/common", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.6.8"

[profile.release]
panic = "abort"
strip = true
# Thin LTO halves the release link time; the executable grows about 1 MB.
lto = "thin"
codegen-units = 16
opt-level = "s"

# CI integration checks exercise behavior, not the shipped binary: skip the
# whole-program optimization that dominates release build time.
[profile.ci-test]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 0

# Dependencies stay optimized (and cached); only the workspace crates, which
# CI rebuilds every run, skip optimization.
[profile.ci-test.package."*"]
opt-level = "s"
