name: Build and release Windows
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
      - name: Full release preflight
        run: node scripts/preflight.mjs --ci
      - name: Preserve failed acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vault-acceptance-failure-${{ github.sha }}
          path: |
            artifacts/*verification.json
            artifacts/regression/**
            docs/evidence/*verification.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve short-lived build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vault-windows-${{ github.sha }}
          path: |
            artifacts/vault-*-setup.exe
            artifacts/installer-size.json
            artifacts/installer-verification.json
            artifacts/installer-handoff-verification.json
            artifacts/installer-rollback-verification.json
            artifacts/installer-drain-verification.json
          retention-days: 7
      - name: Sign update metadata
        if: github.event_name == 'push'
        env:
          VAULT_UPDATE_SIGNING_KEY: ${{ secrets.VAULT_UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: scripts/ci/sign-manifest.ps1
      - name: Publish latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: scripts/ci/publish-release.ps1 -Sha $env:SHA -Repository $env:REPOSITORY
