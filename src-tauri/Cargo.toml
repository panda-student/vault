[package]
name = "local-password-manager"
version = "0.6.1"
description = "Portable Windows password and API credential manager"
edition = "2024"
rust-version = "1.90"
publish = false
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vault-core = { path = "../backend/core" }
vault-mcp = { path = "../backend/mcp" }
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-std", "io-util", "time", "process", "sync", "net"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
[features]
default = []
test-support = []
custom-protocol = ["tauri/custom-protocol"]
